services:
  reverse-proxy:
    image: caddy:2-alpine
    ports:
      - "8088:80"
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - laravel-api
      - react-dashboard
      - next-renderer
    networks:
      default:
        aliases:
          - api.localhost
          - app.localhost
          - sites.localhost
          - preview.localhost
          - fallback.sites.localhost

  laravel-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - ./apps/api:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: php artisan serve --host=0.0.0.0 --port=8000

  laravel-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan horizon

  laravel-scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan schedule:work

  laravel-reverb:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      redis:
        condition: service_started
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8090:8080"

  react-dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      VITE_API_URL: /api/v1
      VITE_API_PROXY: http://laravel-api:8000
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter dashboard dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - laravel-api

  next-renderer:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      API_URL: http://laravel-api:8000
      INTERNAL_RENDERER_SECRET: ${INTERNAL_RENDERER_SECRET:-}
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter renderer exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - laravel-api

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uidesired}
      MYSQL_USER: ${MYSQL_USER:-uidesired}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
